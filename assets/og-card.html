<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Share card source</title>
<!-- The source of assets/og.png. Rendered at 1200x630 by tools/make-og.mjs so
     the card uses the site's real fonts and palette rather than an
     approximation of them. Edit here, re-run the script, commit the png. -->
<link rel="stylesheet" href="site.css">
<style>
  html,body{margin:0;padding:0;background:#07070A}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;
    background:
      radial-gradient(900px 620px at 12% 112%, rgba(255,95,31,.30), transparent 62%),
      radial-gradient(700px 500px at 88% -12%, rgba(255,177,61,.14), transparent 60%),
      #07070A;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:64px 72px;box-sizing:border-box}
  .grain{position:absolute;inset:0;opacity:.055;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.6'/></svg>")}
  .top{display:flex;align-items:center;gap:20px;position:relative;z-index:2}
  .top img{height:78px;width:auto;display:block}
  .wm{line-height:.94}
  .wm b{display:block;font-family:"Archivo",system-ui,sans-serif;font-weight:800;
    font-variation-settings:"wdth" 112;letter-spacing:-.035em;font-size:40px;color:#F0EAE0}
  .wm span{display:block;font-family:"JetBrains Mono",monospace;font-size:13px;
    letter-spacing:.42em;color:#9B958C;margin-top:7px}
  .mid{position:relative;z-index:2;max-width:1010px}
  h1{margin:0;font-family:"Outfit","Jost",system-ui,sans-serif;font-weight:800;
    letter-spacing:-.032em;line-height:1.0;font-size:92px;color:#F0EAE0}
  h1 i{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;
    color:#FFB13D;letter-spacing:-.012em}
  .bot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:2}
  .chip{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.13em;
    text-transform:uppercase;color:#C9C2B8;border:1px solid rgba(240,234,224,.22);
    border-radius:100px;padding:10px 19px}
  .chip.hot{color:#0F0702;border-color:transparent;font-weight:700;
    background:linear-gradient(112deg,#FFD98A,#FF5F1F)}
  .rule{position:absolute;left:0;right:0;bottom:0;height:7px;
    background:linear-gradient(90deg,#FF5F1F,#FFB13D 42%,#FFD98A 66%,transparent)}
</style>
</head>
<body>
<div class="card">
  <div class="grain"></div>

  <div class="top">
    <img src="mark.png" alt="">
    <div class="wm"><b>MATCHSTICK</b><span>STUDIOS</span></div>
  </div>

  <div class="mid">
    <h1>We light up<br><i>what you’re selling.</i></h1>
  </div>

  <div class="bot">
    <span class="chip hot">Branding</span>
    <span class="chip">Creatives</span>
    <span class="chip">Social</span>
    <span class="chip">Meta &amp; Google Ads</span>
    <span class="chip">Lead Gen</span>
    <span class="chip">Websites</span>
  </div>

  <div class="rule"></div>
</div>
</body>
</html>
