<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio — Matchstick</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07070A">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png">
<link rel="stylesheet" href="studio.css?v=muoiag69">
</head>
<body>

<!-- signed out -->
<div id="login" class="login" hidden>
  <h1>Studio</h1>
  <p class="sub">Sign in to edit the site.</p>
  <form id="loginForm">
    <div class="f">
      <label for="em">Email</label>
      <input class="inp" id="em" type="email" autocomplete="username" required>
    </div>
    <div class="f">
      <label for="pw">Password</label>
      <div class="pwWrap">
        <input class="inp" id="pw" type="password" autocomplete="current-password" required>
        <button class="pwEye" id="pwEye" type="button" aria-label="Show password" title="Show password"></button>
      </div>
    </div>
    <div class="f"><button class="btn" style="width:100%;justify-content:center" type="submit">Sign in</button></div>
    <p class="err" id="loginErr"></p>
    <p style="text-align:center;margin-top:14px">
      <button class="linky" id="forgot" type="button">Forgot your password?</button>
    </p>
  </form>

  <!-- asking for a reset link -->
  <form id="resetForm" hidden>
    <div class="f">
      <label for="rEm">Email</label>
      <input class="inp" id="rEm" type="email" autocomplete="username" required>
      <span class="hint">We will send a link that signs you in and lets you set a new password.</span>
    </div>
    <div class="f"><button class="btn" style="width:100%;justify-content:center" type="submit">Send reset link</button></div>
    <p class="err" id="resetErr"></p>
    <p style="text-align:center;margin-top:14px">
      <button class="linky" id="backToLogin" type="button">Back to sign in</button>
    </p>
  </form>

  <!-- arrived from the emailed link -->
  <form id="newPwForm" hidden>
    <div class="f">
      <label for="np">New password</label>
      <div class="pwWrap">
        <input class="inp" id="np" type="password" autocomplete="new-password" minlength="8" required>
        <button class="pwEye" id="npEye" type="button" aria-label="Show password"></button>
      </div>
      <span class="hint">At least 8 characters.</span>
    </div>
    <div class="f"><button class="btn" style="width:100%;justify-content:center" type="submit">Set password</button></div>
    <p class="err" id="newPwErr"></p>
  </form>
</div>

<!-- signed in -->
<div id="app" hidden>
  <header class="bar">
    <div class="wrap">
      <div class="barIn">
        <span class="logo">MATCHSTICK <span>studio</span></span>
        <span class="spacer"></span>
        <button class="btn gho sm" id="preview" title="Open the site showing your unpublished changes">Preview</button>
        <button class="btn sm" id="publish">Publish changes</button>
        <span class="who" id="who"></span>
        <button class="btn gho sm" id="out">Sign out</button>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>

<div id="boot" class="login"><p class="sub">Connecting…</p><p class="err" id="bootErr"></p></div>

<div class="saveBar" id="saveBar">
  <div class="wrap saveIn">
    <button class="btn gho sm icon" id="undo" title="Undo" aria-label="Undo" disabled>&#8630;</button>
    <button class="btn gho sm icon" id="redo" title="Redo" aria-label="Redo" disabled>&#8631;</button>
    <span class="msg" id="saveMsg"></span>
    <button class="btn gho sm" id="cancelAll" disabled>Cancel changes</button>
    <button class="btn gho sm" id="savePreview">Save &amp; preview</button>
    <button class="btn" id="save">Save</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- publish confirmation -->
<div class="modalBg" id="pubModal" hidden>
  <div class="modal">
    <h2 id="pubTitle">Publish changes?</h2>
    <p id="pubBody">Everything saved in the studio will go live on the website.
      It takes about a minute.</p>
    <div class="modalActs" id="pubActs">
      <button class="btn gho" id="pubCancel">Cancel</button>
      <button class="btn" id="pubGo">Yes, publish</button>
    </div>
  </div>
</div>

<script type="module" src="studio.js?v=muoiag69"></script>
</body>
</html>
