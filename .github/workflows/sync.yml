# Pulls content from Supabase once a day and, if anything changed, commits it.
# The commit lands on main, which triggers the deploy workflow.
#
# It runs daily whether or not anything changed, and that is on purpose: a free
# Supabase project is paused after seven days without a single API request, and
# a paused project cannot be read from. One request a day keeps it awake.
#
# "Run workflow" in the Actions tab publishes an edit immediately rather than
# waiting for the next run.

name: Sync content from Supabase

on:
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC daily, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pull from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SYNC_REQUIRED: "1"     # a missing key is a failure here, not a shrug
        run: node sync.mjs

      - name: Commit anything that moved
        run: |
          if [ -z "$(git status --porcelain content)" ]; then
            echo "Nothing changed. Supabase was still pinged, which is half the point."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Content update from Supabase"
          git push
