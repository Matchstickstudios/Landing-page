# Builds the site and publishes it to GitHub Pages on every push to main.
#
# Content is pulled from Supabase first, then the blog pages, the sitemap and
# robots.txt are generated from it. The admin at /admin/ is a static page and
# needs no build. If the Supabase secrets are absent the sync is a no-op and
# the committed content is published as-is, so the site is never held hostage
# to the database being reachable.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Pull content from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node sync.mjs

      - name: Build the blog, sitemap and robots.txt
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node build.mjs


      - name: Drop what the site does not need
        run: rm -rf node_modules .github

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
