# Pulls content from Supabase, builds the site and publishes it to Pages.
#
# Runs on every push, once a day, and on demand from the Actions tab.
#
# This used to be two workflows: one that synced and committed, and this one,
# which was expected to fire on that commit. It never would have. A push made
# with the built-in GITHUB_TOKEN deliberately does not trigger other workflows,
# so the nightly sync would have committed the studio's edits into git and left
# the live site exactly as it was.
#
# One workflow, no handover: sync, commit the change for the record, build,
# deploy. The daily run also makes the one Supabase request that stops a free
# project being paused for inactivity.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"          # 03:17 UTC, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write                  # the sync commits what it pulled
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Pull content from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node sync.mjs

      - name: Commit what the sync pulled
        # only on the scheduled and manual runs; a push already carries its own
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain content)" ]; then
            echo "Nothing changed. Supabase was still pinged, which is half the point."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Content update from Supabase"
          git push

      - name: Build the blog, 404, sitemap and robots.txt
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node build.mjs

      - name: Drop what the site does not need
        run: rm -rf node_modules .github

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
