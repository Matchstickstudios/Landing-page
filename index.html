/* one fetch per file, in parallel, straight off the same origin the page came
   from. They are small and static, so the browser cache does the rest. */
function loadContent(){
  var names=["site","team","services","projects","why","brief","theme"];
  return Promise.all(names.map(function(n){
    return fetch("content/"+n+".json",{cache:"no-cache"})
      .then(function(r){if(!r.ok)throw new Error(n+": "+r.status);return r.json();});
  })).then(function(r){
    var site=r[0],team=r[1],svc=r[2],proj=r[3],why=r[4],brief=r[5],theme=r[6];

    NAV    = (site.nav||[]).map(function(n){return [n.label,n.id];});
    SOCIAL = (site.social||[]).map(function(s){return [s.name,s.url];});
    TICK   = site.ticker||[];
    STORY  = site.story||"";
    HUD    = (site.stats||[]).map(function(s){return [s.value,s.label];});

    TEAM    = (team.members||[]).map(function(m){
      return {n:m.name,r:m.role,i:m.initials,d:m.bio,does:m.does||[]};});
    CREWPOS = (team.members||[]).map(function(m){
      return m.pos||{x:0,y:0,r:0};});

    CH   = (svc.services||[]).map(function(c){
      return {t:c.title,k:c.kicker,s:c.summary,get:c.get||[],d30:c.first30};});
    WORK = (proj.projects||[]).map(function(p){
      return {t:p.title,k:p.tag,d:p.summary,g:p.chips||[]};});
    WHY  = (why.reasons||[]).map(function(w){
      return {t:w.title,d:w.body,x:w.x,y:w.y,r:w.r};});

    BRIEF = {need:brief.services||[],who:brief.who||[],
             when:(brief.when||[]).map(function(o){return {v:o.value,e:o.emoji};})};

    /* the palette is a set of custom properties, so a colour change is a
       one-line write rather than a rebuild */
    if(theme&&theme.colors){
      var root=document.documentElement;
      Object.keys(theme.colors).forEach(function(k){
        root.style.setProperty("--"+k,theme.colors[k]);});
    }
    if(theme&&theme.contact)CONTACT=theme.contact;
  }).then(function(){
    /* optional: absent on a site that is not wired to Supabase yet */
    return fetch("content/supabase.json",{cache:"no-cache"})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(c){ if(c&&c.url&&c.anonKey)SUPA={url:c.url,key:c.anonKey}; })
      .catch(function(){});
  });
}
/* a nav entry is a section id by default, but "/blog/" or a full URL is
   taken at face value, so the bar can point off the page. */
function navHref(id){
  return (/^(https?:|\/|\.)/.test(id)) ? id : "#"+id;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

/* ---------------- the fire: embers + strike sparks, one canvas ---------------- */
var cv,ctx,W=0,H=0,DPR=1,EM=[],SP=[],PX=-999,PY=-999,VX=0,reduce=false;
/* 86 embers over a full-screen canvas is a desktop number. A phone is painting
   the same canvas plus three fixed overlays on a fraction of the GPU. */
var COARSE=window.matchMedia("(pointer:coarse)").matches||innerWidth<=900;
var EMBERS=COARSE?34:86;
function fxResize(){
  /* a phone reports 3; at 1.5 that is a 1170x2000 canvas cleared and redrawn
     sixty times a second for a handful of soft embers nobody is counting */
  DPR=Math.min(COARSE?1:1.5,window.devicePixelRatio||1);
  W=cv.width=Math.floor(innerWidth*DPR); H=cv.height=Math.floor(innerHeight*DPR);
  cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
}
function ember(){
  return {x:Math.random()*W,y:H+Math.random()*70*DPR,
    vx:(Math.random()-.5)*.2*DPR, vy:-(.22+Math.random()*.8)*DPR,
    r:(.55+Math.random()*2)*DPR, life:1, decay:.0014+Math.random()*.0026,
    hue:16+Math.random()*28, ph:Math.random()*6.28};
}
function sparkBurst(x,y,n,spread){
  spread=spread||1;
  for(var i=0;i<n;i++){
    var a=(-Math.PI*.12)-Math.random()*Math.PI*.76, sp=(1.4+Math.random()*7.5)*DPR*spread;
    SP.push({x:x*DPR,y:y*DPR,vx:Math.cos(a)*sp+(Math.random()-.5)*2.4*DPR,vy:Math.sin(a)*sp,
      r:(.6+Math.random()*1.8)*DPR,life:1,decay:.017+Math.random()*.032,hue:20+Math.random()*34});
  }
}
function fxLoop(){
  ctx.clearRect(0,0,W,H);
  var i,p,dx,dy,d2,f;
  if(!reduce){
    while(EM.length<EMBERS) EM.push(ember());
    for(i=EM.length-1;i>=0;i--){
      p=EM[i];
      p.x+=p.vx+Math.sin(p.y*.007+p.ph)*.26*DPR + VX*.4;
      p.y+=p.vy; p.life-=p.decay;
      dx=p.x-PX*DPR; dy=p.y-PY*DPR; d2=dx*dx+dy*dy;
      if(d2<26000*DPR*DPR){ f=(1-d2/(26000*DPR*DPR)); p.vx+=(dx>0?1:-1)*f*.055; p.vy-=f*.07; }
      if(p.life<=0||p.y<-30){ EM.splice(i,1); continue; }
      ctx.globalAlpha=Math.max(0,p.life)*.78;
      ctx.fillStyle="hsl("+p.hue+",100%,"+(54+p.life*20)+"%)";
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(.4+p.life*.8),0,6.284); ctx.fill();
    }
  }
  for(i=SP.length-1;i>=0;i--){
    p=SP[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.24*DPR; p.vx*=.984; p.life-=p.decay;
    if(p.life<=0){SP.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle="hsl("+p.hue+",100%,"+(58+p.life*34)+"%)";
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,6.284); ctx.fill();
  }
  ctx.globalAlpha=1;
  VX*=.9;
  requestAnimationFrame(fxLoop);
}

<script>
/* ---------------- shell ---------------- */
function say(m){var t=document.getElementById("tst");
  document.getElementById("tstM").textContent=m;t.classList.add("on");
  clearTimeout(window._t);window._t=setTimeout(function(){t.classList.remove("on");},2800);}
function toggleNav(on){var m=document.getElementById("msheet");if(!m)return;
  if(on===undefined)on=!m.classList.contains("on");
  m.classList.toggle("on",!!on);document.body.style.overflow=on?"hidden":"";}
document.addEventListener("keydown",function(e){if(e.key==="Escape")toggleNav(0);});

/* ---------------- what we do: the rack ---------------- */
var deskA=0, deskSel={};
function deskPick(i){
  deskA=i;
  var ps=document.querySelectorAll(".hxc");
  for(var k=0;k<ps.length;k++){
    ps[k].classList.toggle("on",k===i);
    var hit=ps[k].querySelector(".hxHit");
    if(hit)hit.setAttribute("aria-expanded",k===i?"true":"false");
  }
  deskPaint();                      /* no-ops now the detail lives in the panel */
  var d=document.querySelector("#hx"+i+" .hxAdd");
  if(d){var r=d.getBoundingClientRect();sparkBurst(r.left+r.width/2,r.top+r.height/2,12,.7);}
}
function deskToggle(i){
  deskSel[i]=!deskSel[i];
  var b=document.getElementById("ad"+i);
  b.classList.toggle("on",!!deskSel[i]);
  b.setAttribute("aria-pressed",deskSel[i]?"true":"false");
  if(deskSel[i]){
    var r=b.getBoundingClientRect();
    sparkBurst(r.left+r.width/2,r.top+r.height/2,18,.85);
    say(txt(CH[i].t)+" added to your list");
  }else say(txt(CH[i].t)+" removed");
  if(i===deskA)deskPaint(); else scopePaint();
}
function txt(s){var d=document.createElement("div");d.innerHTML=s;return d.textContent;}
function deskPaint(){
  var el=document.getElementById("rackCard"); if(!el)return;
  var c=CH[deskA], on=!!deskSel[deskA];
  el.innerHTML='<div class="rcTop"><span class="mono hot">'+esc(c.k)+'</span></div>'
    +'<div class="rcBody rcFade">'
      +'<div class="rcH">'+c.t+'</div>'
      +'<p class="rcLine">'+esc(c.s)+'</p>'
      +'<div class="rcLab">What you get</div>'
      +'<ul class="rcGet">'+c.get.map(function(g){return '<li>'+esc(g)+'</li>';}).join("")+'</ul>'
      +'<div class="rcLab">The first thirty days</div>'
      +'<p class="rc30">'+esc(c.d30)+'</p>'
      +'<button class="btn mag" style="width:100%;justify-content:center;margin-top:24px" '
        +'onclick="deskToggle('+deskA+')">'+(on?"Remove from your list":"Add to your list")+'</button>'
    +'</div>';
  var m=el.querySelector(".mag"); if(m)magnet(m);

function scopePaint(){
  var n=0, chips=[];
  CH.forEach(function(c,i){if(deskSel[i]){n++;chips.push('<span>'+c.t+'</span>');}});
  var sn=document.getElementById("scopeN"); if(sn)sn.textContent=n+" of 6";
  var sc=document.getElementById("scopeChips");
  if(sc)sc.innerHTML = n?chips.join("")
    :'<em>Nothing picked yet &#183; tap the + on any line</em>';
}
function scopeSend(){
  var picked=[];
  CH.forEach(function(c,i){if(deskSel[i])picked.push(txt(c.t));});
  if(!picked.length){say("Pick at least one of the six first");return;}
  var s = picked.length===6 ? "all six"
        : picked.length>2 ? picked.slice(0,-1).join(", ")+" and "+picked[picked.length-1]
        : picked.join(" and ");

}

/* ---------------- the strike stage ---------------- */
var ignLast=-1, ignBang=false, ignSeen=false;
var _ignHigh=0;
function eo3(k){return 1-Math.pow(1-k,3);}
function paintIgnite(){
  if(_ignDone)return;                     /* the section has left the document */
  var tr=document.getElementById("ignTrack"); if(!tr)return;
  var r=tr.getBoundingClientRect(), vh=innerHeight;
  /* A fast scroll can take the track from half-visible to well above the fold
     between two frames. The old guard simply returned, so _ignHigh never
     reached 1, the strike counted as unfinished and the section was never
     removed. Once it is behind the reader it has been struck, by definition. */
  if(r.bottom<-200){ _ignHigh=1; return; }
  if(r.top>vh+200)return;                           /* not here yet */
  var p=Math.max(0,Math.min(1,(-r.top)/Math.max(1,r.height-vh)));
  if(reduce)p=1;
  /* one-way: the match lights once. Scrolling back up used to run the whole
     strike in reverse and blow the flame out again. */
  if(p>_ignHigh)_ignHigh=p; else p=_ignHigh;
  if(_ignHigh>=1&&document.body.classList.contains("preLit"))
    document.body.classList.remove("preLit");
  var A=.26, B=.47, C=.66;                           /* approach | strike | ignition | burn */
  var st=document.getElementById("ignStick"),
      fl=document.getElementById("stkFlame"),
      hd=document.getElementById("stkHead"),
      hz=document.getElementById("ignHaze"),
      sp=document.getElementById("ignStrip"),
      ang, tx, flame=0, stripV=0, stripG=0, stripX=0;

  /* The horizontal travel used to be measured in vh on both layouts. On a
     desktop vh and vw are close enough that it did not matter; on a portrait
     phone a vh is more than twice a vw, so 48vh of approach put the match head
     ~100px past the right edge of a 390px screen and the first third of the
     runway was a blank black scroll. The narrow layout measures its travel
     against the width it actually has. Percentages are of the viewport width,
     relative to the stick's own 30% left offset — so 0.75 lands the head just
     off the right edge and 0.20 leaves it centred. */
  var nar=innerWidth<=900, VW=innerWidth;
  var LAY = nar ? {u:"px",a:-125,i:VW*.75,s0:VW*.42,s1:-VW*.16,e:VW*.20,g0:60,g1:6}
                : {u:"vh",a:-95, i:62,    s0:16,    s1:-14,     e:0,     g0:62,g1:10};
  if(p<A){                                           /* the match comes in from the right */
    var k=eo3(p/A);
    ang=LAY.a; tx=LAY.i-(LAY.i-LAY.s0)*k; flame=0; stripV=k; stripX=LAY.g0+8;
  }else if(p<B){                                     /* dragged along the strip */
    var k=(p-A)/(B-A);
    ang=LAY.a+Math.sin(k*Math.PI*3)*.7; tx=LAY.s0+(LAY.s1-LAY.s0)*k; flame=0; stripV=1;
    stripG=Math.sin(k*Math.PI); stripX=LAY.g0+(LAY.g1-LAY.g0)*k;
  }else if(p<C){                                     /* it catches and stands up */
    var k=eo3((p-B)/(C-B));
    ang=LAY.a*(1-k); tx=LAY.s1+(LAY.e-LAY.s1)*k; flame=k; stripV=1-k; stripG=(1-k)*.6; stripX=LAY.g1;
  }else{                                             /* it burns */
    var k=(p-C)/(1-C);
    ang=Math.sin(p*22)*.8; tx=LAY.e; flame=1+k*.16; stripV=0;
    st.style.setProperty("--char",(k*30).toFixed(1)+"%");
  }

  if(p<C)st.style.setProperty("--char","0%");
  st.style.transform="translateX("+tx.toFixed(2)+LAY.u+") rotate("+ang.toFixed(2)+"deg)";
  fl.style.setProperty("--f",flame.toFixed(3));
  hd.style.setProperty("--hglow",(flame*46).toFixed(1)+"px");
  sp.style.setProperty("--sv",stripV.toFixed(3));
  sp.style.setProperty("--sg",stripG.toFixed(3));
  sp.style.setProperty("--sx",stripX.toFixed(1)+"%");
  document.getElementById("ignStage").classList.toggle("burning",flame>.05);

  /* the light follows the head */
  var hr=hd.getBoundingClientRect();
  var hx=hr.left+hr.width/2, hy=hr.top+hr.height*.1;
  var stg=document.getElementById("ignStage").getBoundingClientRect();
  hz.style.setProperty("--f",Math.min(1,flame*1.05).toFixed(3));
  hz.style.setProperty("--hx",((hx-stg.left)/Math.max(1,stg.width)*100).toFixed(1)+"%");
  hz.style.setProperty("--hy",((hy-stg.top)/Math.max(1,stg.height)*100).toFixed(1)+"%");

  /* friction sparks while it is being dragged */
  if(!reduce && p>A && p<B && ignLast>=0){
    var dp=Math.abs(p-ignLast);
    if(dp>.0006)sparkBurst(hx,hy+hr.height*.3,Math.min(9,Math.round(dp*900)+2),.95);
  }
  /* the moment it catches */
  if(!reduce && p>=B && !ignBang){ignBang=true;sparkBurst(hx,hy,120,1.35);}
  if(p<B-.02)ignBang=false;
  ignLast=p;

  /* the words */
  document.getElementById("w0").classList.toggle("on",p>.02&&p<A+.02);
  document.getElementById("w1").classList.toggle("on",p>A+.06&&p<C-.02);
  document.getElementById("w2").classList.toggle("on",p>C+.03);
  var lab=document.getElementById("ignLab");
  lab.textContent = p<A ? "Keep scrolling · strike it"
    : p<B ? "Harder · it is nearly there"
    : p<C ? "Caught" : "Lit";
  lab.style.color = p>=B ? "var(--flame)" : "var(--ash3)";
  document.getElementById("ignHint").style.setProperty("--hint",p>.05?0:1);
}


/* ---------------- the rail ---------------- */
var railIdx=0, railQ=false;
function railEl(){return document.getElementById("rail");}
function railStep(){
  var c=document.querySelector(".wk");
  if(!c)return 320;
  var g=parseFloat(getComputedStyle(railEl()).columnGap||"18")||18;
  return c.getBoundingClientRect().width+g;
}
function railGo(d){
  var r=railEl(); if(!r)return;
  r.scrollBy({left:d*railStep(),behavior:"smooth"});
}
function railTo(i){
  var r=railEl(); if(!r)return;
  r.scrollTo({left:i*railStep(),behavior:"smooth"});
}
/* The arrows move by whole cards from wherever the rail actually is, rather
   than by a fixed distance — a swipe can leave it between two cards, and
   scrollBy from there would land it between two more. Clamped at both ends so
   the last press cannot overshoot into the padding and read as card five. */
function railNudge(d){
  var r=railEl(); if(!r)return;
  var step=railStep(), n=WORK.length;
  var here=Math.round(r.scrollLeft/step);
  railTo(Math.max(0,Math.min(n-1,here+d)));
}
function railSync(){
  var r=railEl(); if(!r)return;
  var max=Math.max(1,r.scrollWidth-r.clientWidth),
      p=Math.min(1,Math.max(0,r.scrollLeft/max)),
      i=Math.round(r.scrollLeft/railStep()),
      n=WORK.length;
  i=Math.min(n-1,Math.max(0,i));
  if(i!==railIdx){
    railIdx=i;
    document.querySelectorAll(".wk").forEach(function(c,k){c.classList.toggle("on",k===i);});
    document.querySelectorAll("#railDots button").forEach(function(b,k){b.classList.toggle("on",k===i);});
    var ix=document.getElementById("railIx");
    if(ix)ix.textContent=(i+1<10?"0":"")+(i+1)+" / "+(n<10?"0":"")+n;
    if(i>0){var sw=document.getElementById("railSwipe"); if(sw)sw.classList.add("gone");}
  }
  var f=document.getElementById("railFill");
  var vis=Math.min(1,r.clientWidth/Math.max(1,r.scrollWidth));
  f.style.width=(vis*100).toFixed(2)+"%";
  f.style.transform="translateX("+((1/Math.max(.0001,vis)-1)*p*100).toFixed(2)+"%)";
  /* the prev/next arrows were removed, so guard rather than assume they exist */
  var pv=document.getElementById("railPrev"), nx=document.getElementById("railNext");
  if(pv)pv.disabled=r.scrollLeft<4;
  if(nx)nx.disabled=r.scrollLeft>max-4;
  /* the swipe prompt is for a finger; once either arrow has been used the
     reader has clearly found the controls */
  if(r.scrollLeft>4){var sw=document.getElementById("railSwipe"); if(sw)sw.classList.add("gone");}
}
function railWire(){
  var r=railEl(); if(!r)return;
  r.addEventListener("scroll",function(){
    if(railQ)return; railQ=true;
    requestAnimationFrame(function(){railQ=false;railSync();});
  },{passive:true});
  /* drag to pan, without breaking clicks or native momentum */
  var down=false,sx=0,sl=0,moved=0;
  r.addEventListener("pointerdown",function(e){
    if(e.pointerType==="touch")return;
    down=true;moved=0;sx=e.clientX;sl=r.scrollLeft;r.classList.add("drag");
  });
  window.addEventListener("pointermove",function(e){
    if(!down)return;
    var dx=e.clientX-sx; moved=Math.max(moved,Math.abs(dx));
    r.scrollLeft=sl-dx;
  },{passive:true});
  window.addEventListener("pointerup",function(){
    if(!down)return; down=false; r.classList.remove("drag");
    if(moved>6)railTo(Math.round(r.scrollLeft/railStep()));
  });
  r.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"){e.preventDefault();railGo(1);}
    if(e.key==="ArrowLeft"){e.preventDefault();railGo(-1);}
  });
  railSync();
}

/* ---------------- the team, picked up ----------------
   The reasons used to be the cards you threw about and the team sat still.
   They have traded, so this wires the plates instead. The grab is not claimed
   until the pointer has travelled a few pixels, so a tap still taps and, with
   touch-action:pan-y, a vertical swipe still scrolls. The card keeps its slot
   and only the transform moves, so nothing reflows underneath it. */
var _pickRest=[];
function pickWire(){
  var host=document.querySelector(".crewGrid"); if(!host)return;
  _pickRest=[];
  host.querySelectorAll(".pc").forEach(function(el,i){
    var ox=0,oy=0,sx=0,sy=0,on=false,cap=false;
    /* Loose on the desktop scatter the lean is what makes them look dropped
       rather than placed. Below 1080px they are a tidy grid — one column on a
       phone — and there a couple of degrees is not a flourish, it is four
       cards that look like they failed to line up. They sit square, and the
       lean comes back only while one is actually being dragged. */
    function base(){var r=(CREWPOS[i]||{r:0}).r;return innerWidth<=1080?0:r;}
    function set(x,y,rot,t){el.style.transition=t||"";
      el.style.transform="translate("+x+"px,"+y+"px) rotate("+rot+"deg)";}
    function rest(){ if(!on) set(0,0,base()); }
    _pickRest.push(rest); rest();
    el.addEventListener("pointerdown",function(e){
      if(e.target.closest&&e.target.closest("a,button"))return;
      on=true;cap=false;sx=e.clientX;sy=e.clientY;ox=0;oy=0;});
    el.addEventListener("pointermove",function(e){
      if(!on)return;
      var nx=e.clientX-sx, ny=e.clientY-sy;
      if(!cap){
        if(Math.abs(nx)<5&&Math.abs(ny)<5)return;
        cap=true; el.classList.add("grab"); host.classList.add("touched");
        try{el.setPointerCapture(e.pointerId);}catch(_){}
      }
      ox=nx; oy=ny;
      set(ox,oy,base()+Math.max(-15,Math.min(15,ox*.036)));});
    ["pointerup","pointercancel","lostpointercapture"].forEach(function(ev){
      el.addEventListener(ev,function(){
        if(!on)return; on=false; ox=0; oy=0;
        if(!cap)return;
        cap=false; el.classList.remove("grab");
        set(0,0,base(),"transform .95s cubic-bezier(.18,1.5,.35,1)");});});
  });
}
function pickReset(){ _pickRest.forEach(function(f){f();}); fitCrewField(); }

/* The scatter is absolutely positioned, so its container has no height of its
   own and had to be given one. A fixed min-height is a guess, and the guess
   left a screen's worth of blank between the last card and the next section.
   The field is measured from the lowest card instead. */
function fitCrewField(){
  var host=document.querySelector(".crewGrid"); if(!host)return;
  if(innerWidth<=1080){ host.style.height=""; return; }   /* it is a grid down there */
  var low=0;
  host.querySelectorAll(".pc").forEach(function(el){
    low=Math.max(low,el.offsetTop+el.offsetHeight);
  });
  host.style.height=low?(low+24)+"px":"";
}

function mailGlyph(){return '<svg class="bIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
 +'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
 +'<rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3 6.5 9 6.5 9-6.5"/></svg>';}
function phoneGlyph(){return '<svg class="bIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
 +'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
 +'<path d="M6.3 3.5h3l1.5 3.8-2 1.3a12.5 12.5 0 0 0 5.6 5.6l1.3-2 3.8 1.5v3a2 2 0 0 1-2.2 2'
 +'A16.8 16.8 0 0 1 4.3 5.7a2 2 0 0 1 2-2.2Z"/></svg>';}
function waGlyph(){return '<svg class="bIco" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'

/* The phone field was a plain text box, so it accepted letters and punctuation
   and those went straight into the enquiry. It keeps digits, and a single
   leading +, and formats nothing else. */
function digitsOnly(el){
  var plus=el.value.trim().charAt(0)==="+";
  var d=el.value.replace(/\D+/g,"");
  el.value=(plus?"+":"")+d;
}

/* ---------------------------------------------------------------------------
   Where a submitted enquiry goes.

   There is no server behind this file, so "stored for us" can only mean one of
   two things. Set FORM_ENDPOINT to a form service URL (Formspree, Basin, a
   Google Apps Script web app, your own handler) and the details are POSTed
   there and actually reach you. Leave it empty and they are kept in this
   browser's localStorage, which means they sit on the visitor's own device and
   you cannot see them — useful for testing, useless for collecting leads.
   Until an endpoint is set the two send buttons are what actually deliver.

   With Supabase configured below, enquiries go into the `enquiries` table
   instead. The anon key is meant to be public: the row-level policy on that
   table allows an insert from anyone and a read from nobody, so a visitor can
   leave their details and cannot look at anyone else's.
   --------------------------------------------------------------------------- */
var FORM_ENDPOINT="";

/* filled by content/supabase.json when the project is connected */
var SUPA={url:"",key:""};
function supaReady(){ return !!(SUPA.url && SUPA.key); }

/* one insert, best effort. A failure here must never stop the visitor: the
   WhatsApp and email buttons are still what actually delivers the enquiry. */
function supaEnquiry(rec,via){
  if(!supaReady())return Promise.resolve(false);
  return fetch(SUPA.url.replace(/\/$/,"")+"/rest/v1/enquiries",{
    method:"POST",
    headers:{"Content-Type":"application/json",
             apikey:SUPA.key, Authorization:"Bearer "+SUPA.key,
             Prefer:"return=minimal"},
    body:JSON.stringify({
      name:rec.name, phone:rec.phone, email:rec.email,
      services:rec.services, who:rec.who, start_when:rec.when,
      message:rec.business, sent_via:via||null,
      user_agent:navigator.userAgent.slice(0,300)})
  }).then(function(r){return r.ok;}).catch(function(){return false;});
}

function briefRecord(){
  var v=function(id){var e=document.getElementById(id);return e?e.value.trim():"";};
  return {at:new Date().toISOString(),
          services:(brief.need&&brief.need.length)?brief.need.slice():[],
          who:brief.who||"", when:brief.when||"", business:v("fElse"),
          name:v("fName"), phone:v("fPhone"), email:v("fEmail")};
}
function saveBrief(quiet){
  if(!briefValid())return;
  var rec=briefRecord();
  function done(msg){ if(!quiet) say(msg); }
  if(supaReady()){
    supaEnquiry(rec,window._briefVia||null).then(function(ok){
      done(ok?"Sent. We have your details.":"Could not send just now");});
  }else if(FORM_ENDPOINT){
    fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(rec)})
      .then(function(r){ done(r.ok?"Sent. We have your details.":"Could not send just now"); })
      .catch(function(){ done("Could not send just now"); });
  }else{
    try{
      var all=JSON.parse(localStorage.getItem("ms.enquiries")||"[]");
      all.push(rec); localStorage.setItem("ms.enquiries",JSON.stringify(all));
      done("Saved on this device \u00b7 send it below so it reaches us");
    }catch(e){ done("Could not save on this device"); }
  }
  var b=document.querySelector(".bSave .btn");
  if(b){var r=b.getBoundingClientRect();sparkBurst(r.left+r.width/2,r.top+8,40,1.1);}
}
/* so the studio can pull what a test run collected: msEnquiries() in the console */
function msEnquiries(){
  try{return JSON.parse(localStorage.getItem("ms.enquiries")||"[]");}catch(e){return [];}
}

/* one place builds the message, so mail and WhatsApp can never disagree */
function briefLines(){
  var v=function(id){var e=document.getElementById(id);return e?e.value.trim():"";};
  var L=[];
  if(brief.need&&brief.need.length)L.push("Services: "+brief.need.join(", "));
  if(brief.who)L.push("We are: "+brief.who);
  if(brief.when)L.push("Start: "+brief.when);
  if(v("fElse"))L.push("Their business: "+v("fElse"));
  L.push("");
  if(v("fName"))L.push("Name: "+v("fName"));
  if(v("fPhone"))L.push("Phone: "+v("fPhone"));
  if(v("fEmail"))L.push("Email: "+v("fEmail"));
  return L.join("\n");
}
function briefValid(){
  var v=function(id){var e=document.getElementById(id);return e?e.value.trim():"";};
  var picked=(brief.need&&brief.need.length)||v("fElse");
  if(!picked){say("Pick a service, or tell us what you need");
    document.getElementById("oNeed").scrollIntoView({block:"center",behavior:"smooth"});return false;}
  var mail=v("fEmail"), ph=v("fPhone");
  if(!mail&&!ph){say("Leave a phone number or an email so we can reply");
    document.getElementById("fPhone").focus();return false;}
  if(mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){
    document.getElementById("fEmail").classList.add("bad");
    document.getElementById("fEmail").focus();say("That email does not look right");return false;}
  document.getElementById("fEmail").classList.remove("bad");
  return true;
}
function sendWA(){
  if(!briefValid())return;
  window._briefVia="whatsapp";
  saveBrief(true);                    /* the record is kept without a second step */
  var t="New enquiry for Matchstick Studios\n\n"+briefLines();
  var n=(CONTACT&&CONTACT.whatsapp)||"917904888874";
  window.open("https://wa.me/"+n+"?text="+encodeURIComponent(t),"_blank","noopener");
  say("Opening WhatsApp with your enquiry");
}
function pick(k,btn){
  /* the Start row prints an emoji inside the button, so the label is no longer
     the answer — data-v is, and it is what the sentence and the email carry. */
  var v=(btn.getAttribute("data-v")||btn.textContent).trim();
  brief[k]=v;

}
function sendBrief(ev){
  ev.preventDefault();
  if(!briefValid())return false;
  window._briefVia="email";
  saveBrief(true);                    /* the record is kept without a second step */
  var sub="New enquiry"+(brief.need&&brief.need.length?": "+brief.need.join(", "):"");
  var to=(CONTACT&&CONTACT.email)||"matchstickstudios@gmail.com";

/* ---------------- motion ---------------- */
function spotlight(el){
  el.addEventListener("pointermove",function(e){
    var r=el.getBoundingClientRect();
    el.style.setProperty("--spx",(e.clientX-r.left)+"px");
    el.style.setProperty("--spy",(e.clientY-r.top)+"px");},{passive:true});
}
function tilt(el){
  var burst=0;
  el.addEventListener("pointermove",function(e){
    var r=el.getBoundingClientRect();
    var px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
    el.style.transform="perspective(880px) rotateX("+(-py*7).toFixed(2)+"deg) rotateY("
      +(px*8).toFixed(2)+"deg) translateY(-6px)";},{passive:true});
  el.addEventListener("pointerenter",function(e){
    if(Date.now()-burst<900)return; burst=Date.now();
    var r=el.getBoundingClientRect(); sparkBurst(r.left+r.width/2,r.top+r.height*.3,16,.5);});
  el.addEventListener("pointerleave",function(){el.style.transform="";});
}
function magnet(el){
  el.addEventListener("pointermove",function(e){
    var r=el.getBoundingClientRect();
    el.style.transform="translate("+((e.clientX-r.left-r.width/2)*.2).toFixed(1)+"px,"
      +((e.clientY-r.top-r.height/2)*.28).toFixed(1)+"px)";},{passive:true});
  el.addEventListener("pointerleave",function(){el.style.transform="";});
}
var CHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/\\<>*#";
function scramble(el){
  if(el._done)return; el._done=1;
  var real=el.dataset.scr||el.textContent, n=real.length, t0=null, dur=620;
  requestAnimationFrame(function step(t){
    if(!t0)t0=t;
    var k=Math.min(1,(t-t0)/dur), lock=Math.floor(k*n), s="";
    for(var i=0;i<n;i++){
      if(i<lock||real[i]===" ") s+=real[i];
      else s+=CHARS[(Math.random()*CHARS.length)|0];
    }
    el.textContent=s;
    if(k<1)requestAnimationFrame(step); else el.textContent=real;
  });
}
function movePill(){
  var a=document.querySelector("#nav a.on"), p=document.getElementById("navPill");
  if(!a||!p)return;
  /* the links are display:none below 1000px, so this was reading offsetWidth —
     a forced layout — on every scroll frame to move something nobody sees */
  if(!a.offsetParent)return;
  p.style.width=a.offsetWidth+"px"; p.style.transform="translateX("+a.offsetLeft+"px)";
}
var lastY=0, rafQ=false, _heat=-1;
function onScroll(){ if(rafQ)return; rafQ=true; requestAnimationFrame(function(){rafQ=false;paintScroll();}); }
function paintScroll(){
  var d=document.documentElement, y=d.scrollTop,
      prog=y/Math.max(1,d.scrollHeight-d.clientHeight);
  var f=document.getElementById("burnFill"), h=document.getElementById("burnHead"),
      tk=document.getElementById("burnTrack");
  if(f&&tk){
    f.style.height=((1-prog)*100)+"%";
    /* top was a percentage of #burn, which also contains the caption beneath
       the track — so at 100% the flame sat ~25px below the end of the rail.
       Measured off the track instead, it lands exactly on the burn line. */
    h.style.top=(tk.offsetTop+prog*tk.offsetHeight)+"px";
    document.getElementById("burnPct").textContent=Math.round(prog*100)+"%";}
  /* the page warms as you get further down. #veil is a fixed, full-viewport
     pair of radial gradients keyed off --heat, so writing it every frame
     repaints the whole screen for a change nobody can see. Two decimals is
     below the threshold of the gradient it feeds. */
  if(Math.abs(prog-_heat)>.005){ _heat=prog; d.style.setProperty("--heat",prog.toFixed(3)); }
  /* scroll velocity leans the content very slightly — a mouse-wheel flourish.
     Under a finger it is a transform written to every heading on the page on
     every frame of a momentum scroll, which is most of the jank on a phone. */
  if(!COARSE){
    var v=Math.max(-42,Math.min(42,y-lastY));
    document.querySelectorAll(".skew").forEach(function(el){
      el.style.transform="skewY("+(v*.035).toFixed(3)+"deg)";});
  }
  fabTuck(y);
  lastY=y;
  var vh=innerHeight;
  document.querySelectorAll(".rv:not(.in)").forEach(function(el){
    if(el.getBoundingClientRect().top<vh*.92){
      el.classList.add("in");
      el.querySelectorAll&&el.querySelectorAll("[data-scr]").forEach(scramble);}});
  var cur=NAV[0][1];
  NAV.forEach(function(n){var s=document.getElementById(n[1]);
    if(s&&s.getBoundingClientRect().top<=150)cur=n[1];});
  document.querySelectorAll("#nav a").forEach(function(a){a.classList.toggle("on",a.dataset.sec===cur);});
  movePill();
  paintIgnite();
  ignCollapse();
}

/* ---------------- the WhatsApp button gets out of the reader's way -------
   It is fixed to the bottom-right corner and the cards run the full measure of
   a phone, so on the way down it parked on top of their copy — a heading in
   "Why us", the closing line of a team card, the label under the brief. It is
   only wanted when the reader has stopped, or has turned back: while the page
   is travelling downwards it tucks off the bottom edge, and it returns the
   moment the scroll settles or reverses. Desktop never sees it move. */
var _fabOut=false;
function fabSet(out){
  var f=document.querySelector(".waFab");
  if(!f||out===_fabOut)return;
  _fabOut=out; f.classList.toggle("tuck",out);
}
function fabTuck(y){
  if(innerWidth>900){fabSet(false);return;}
  var d=document.documentElement,
      end=d.scrollHeight-d.clientHeight,
      dy=y-lastY;
  /* the top of the page and the last screen — the brief and the footer, where
     the reader is looking for a way to get in touch — always carry it */
  if(y<=260||end-y<=520){fabSet(false);return;}
  /* reading onward: it leaves. turning back: it returns. It is deliberately
     not on a timer, because coming back while the reader has stopped on a card
     is exactly the moment it used to land on top of the words. */
  if(dy>5)fabSet(true);
  else if(dy<-5)fabSet(false);
}

/* ---------------- cursor ---------------- */
var _cx=0,_cy=0,_rx=0,_ry=0,_loop=false;
function curInit(){
  var fl=document.getElementById("flame"), ha=document.getElementById("halo");
  if(!window.matchMedia("(hover:hover) and (pointer:fine)").matches)return;
  document.addEventListener("pointermove",function(e){
    VX+=(e.clientX-PX)*.02;
    PX=e.clientX; PY=e.clientY; _cx=e.clientX; _cy=e.clientY;
    var t=e.target.closest?e.target.closest("a,button,.node,.pc,.tc,input"):null;
    ha.classList.toggle("on",!!t);
  },{passive:true});
  if(_loop)return; _loop=true;
  var ds=document.documentElement.style, lx=-1, ly=-1;
  (function run(){
    /* one style write per frame, not one per pointer event */
    if(PX!==lx||PY!==ly){ lx=PX; ly=PY;
      ds.setProperty("--lx",PX+"px"); ds.setProperty("--ly",PY+"px");
      fl.style.transform="translate("+PX+"px,"+PY+"px) translate(-50%,-72%)"; }
    _rx+=(_cx-_rx)*.18;_ry+=(_cy-_ry)*.18;
    ha.style.transform="translate("+_rx.toFixed(1)+"px,"+_ry.toFixed(1)+"px) translate(-50%,-50%)";
    requestAnimationFrame(run);})();
}

/* ---------------- ignition ---------------- */
/* The page used to open behind a full-screen intro that had to be dismissed.
   The strike section is the opening now, so there is nothing to dismiss: the
   page is lit from the first frame. Kept as a function because the rest of the
   file calls it, and because "lit" still switches on the flame cursor and the
   burn rail down the right-hand side. */
function ignite(){
  if(document.body.classList.contains("lit"))return;
  document.body.classList.add("lit");
  onScroll();
}
/* ---------------- the strike runway is spent after one pass ----------------
   .ignTrack is 340vh purely to give the strike animation room to play against
   scroll. That runway is worth it once; on the way back up it is just 240vh of
   dead scrolling. Once the match is lit and the section is behind us, the track
   collapses to a normal 100vh — and scroll is corrected by the same delta so
   the page does not jump under the reader. */
/* ---------------- the strike is spent after one pass ----------------------
   It used to collapse from 340vh to 100vh and stay in the page, so scrolling
   back up walked into a burnt-out match sitting above the hero. It is struck
   once. The moment it is behind the reader the whole section leaves the
   document, and the scroll is corrected by exactly the height that went with
   it so the hero does not jump under them. After that the page starts at the
   hero and there is no way back to it.

   The correction is captured before anything moves and made instant: adding
   the change first lets the browser clamp scrollY to the new maximum, and
   subtracting the height again from an already-clamped value overshoots to the
   top — which is what used to happen. scroll-behavior:smooth also applies to
   scrollTo regardless of the behavior option, so it is switched off for the
   one frame the correction takes. */
var _ignDone=false;
/* The strike is a three-and-a-half screen scroll before the site begins. On a
   phone that reads as "what am I supposed to do?", so mobile gets a way out
   that still leaves the match idea intact for anyone who wants it. */
function skipIntro(){
  _ignHigh=1;
  document.body.classList.remove("preLit");
  /* a skip should land, not glide: html has scroll-behavior:smooth, and gliding
     2300px on a phone reads as the button having done nothing */
  var root=document.documentElement, prev=root.style.scrollBehavior;
  root.style.scrollBehavior="auto";
  /* scrollIntoView honours html{scroll-padding-top:120px}, which is right for
     a nav link landing under the bar and wrong here: it left 120px of the dead
     black stage on screen above the hero. The offset is taken directly. */
  var t=document.getElementById("top");
  if(t)window.scrollTo(0,Math.max(0,t.getBoundingClientRect().top+window.scrollY));
  root.style.scrollBehavior=prev;
  setTimeout(function(){try{ignCollapse();}catch(e){}},60);
}
function ignCollapse(){
  if(_ignDone||_ignHigh<1)return;
  var sec=document.getElementById("light"); if(!sec)return;
  if(sec.getBoundingClientRect().bottom>0)return;   /* still on screen: leave it */
  var y0=window.scrollY, h0=sec.offsetHeight;
  var root=document.documentElement, prevBehavior=root.style.scrollBehavior;
  root.style.scrollBehavior="auto";
  _ignDone=true;
  document.body.classList.add("ignDone");
  sec.parentNode.removeChild(sec);                  /* gone, not collapsed */
  if(h0>0)window.scrollTo(0,Math.max(0,y0-h0));
  root.style.scrollBehavior=prevBehavior;
}

/* ---------------- the burn rail, as a real scrollbar ---------------- */
function burnScrollInit(){
 var burn=document.getElementById("burn"),
     tr=document.getElementById("burnTrack"),
     head=document.getElementById("burnHead");
 if(!burn||!tr||!head)return;
 var drag=false, grabDY=0, pid=null;
 function maxScroll(){
   return Math.max(1,document.documentElement.scrollHeight-innerHeight);
 }
 head.addEventListener("pointerdown",function(e){
   var hr=head.getBoundingClientRect();
   drag=true; pid=e.pointerId;
   /* the offset between the pointer and the centre of the flame is kept for
      the whole gesture, so taking hold of the edge of it does not snap the
      page — it picks up exactly where the reader already was */
   grabDY=e.clientY-(hr.top+hr.height/2);
   burn.classList.add("dragging");
   /* the page is set to scroll-behavior:smooth, which is right for a nav link
      and wrong for a handle — it turns a drag into a rubber band trailing the
      pointer. Instant scrolling is restored for the length of the gesture. */
   document.documentElement.style.scrollBehavior="auto";
   try{head.setPointerCapture(e.pointerId);}catch(_){}
   e.preventDefault();
 });
 head.addEventListener("pointermove",function(e){
   if(!drag)return;
   var r=tr.getBoundingClientRect();
   var k=Math.max(0,Math.min(1,(e.clientY-grabDY-r.top)/r.height));
   scrollTo({top:k*maxScroll(),behavior:"auto"});
   e.preventDefault();
 });
 function end(){
   if(!drag)return;
   drag=false; pid=null; burn.classList.remove("dragging");
   document.documentElement.style.scrollBehavior="";
 }
 ["pointerup","pointercancel","lostpointercapture"].forEach(function(ev){
   head.addEventListener(ev,end);
 });
 addEventListener("pointerup",end);
 /* a stray click on the rail used to jump the page; it now does nothing */
 tr.addEventListener("pointerdown",function(e){e.preventDefault();});
}

/* ---------------- boot ---------------- */
function boot(){
  /* The strike is the first thing on the page now, and it only lights once —
     _ignHigh never runs backwards. If the browser restores the previous scroll
     position on a reload, the match is already burnt out before the reader has
     seen it, and the 340vh runway collapses behind them. The page opens at the
     top, every time. */
  if("scrollRestoration" in history) history.scrollRestoration="manual";
  window.scrollTo(0,0);
  /* the strike happens outside the page: no bar, no rail, no floating buttons
     until the match has caught. Then the furniture arrives and you are in. */
  document.body.classList.add("preLit");
  burnScrollInit();
  reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  cv=document.getElementById("fx"); ctx=cv.getContext("2d");
  fxResize(); window.addEventListener("resize",function(){fxResize();movePill();paintIgnite();railSync();pickReset();});
  requestAnimationFrame(fxLoop);
  document.getElementById("app").innerHTML=page();
  deskPaint(); railWire(); pickWire(); curInit();
  fitCrewField();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitCrewField);
  document.querySelectorAll(".spot").forEach(spotlight);
  document.querySelectorAll(".tilt").forEach(tilt);
  document.querySelectorAll(".mag").forEach(magnet);
  window.addEventListener("scroll",onScroll,{passive:true});
  ignite();
  onScroll(); movePill();
}
/* nothing is drawn from an empty array: the content arrives first, and a
   failure says so on the page rather than rendering a hollow site. */
loadContent().then(boot).catch(function(e){
  document.getElementById("app").innerHTML=
    '<div style="padding:26vh 8vw;font:500 16px/1.6 system-ui;color:#9B958C">'
   +'<p style="color:#FF5F1F;font-weight:700;margin:0 0 10px">Content did not load.</p>'
   +'<p style="margin:0">'+String(e.message||e)+'</p>'
   +'<p style="margin:14px 0 0;font-size:13px">If you are opening this file straight '
   +'from disk, a browser will not fetch the JSON beside it. Run a local server '
   +'(<code>python3 -m http.server</code>) or open the deployed site.</p></div>';
  document.body.classList.add("lit");
});
</script>
